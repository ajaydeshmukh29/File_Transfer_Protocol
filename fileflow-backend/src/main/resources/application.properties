# --- MySQL Database ---
spring.datasource.url=jdbc:mysql://localhost:3306/fileflow_db
spring.datasource.username=root
spring.datasource.password=

# --- Hibernate / JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- JWT ---
# JWT_SECRET must be provided as an environment variable.
# Never commit the actual secret to GitHub.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# --- Embedded FTP Server ---
# The socket-based FTP server starts automatically with the Spring Boot application.
ftp.server.host=127.0.0.1
ftp.server.port=9000

# Files are stored in this directory.
ftp.server.storage-dir=ftp-storage